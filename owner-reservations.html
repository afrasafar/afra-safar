<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>درخواست‌های رزرو | افرا سفر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#18392f;font-family:Vazirmatn,Tahoma,sans-serif}header{background:#123d32;color:#fff;padding:22px 16px}header .wrap,main{max-width:1000px;margin:auto}header h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:#d5e6dd;font-size:13px}.wrap{padding-left:16px;padding-right:16px}main{padding:24px 16px 50px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 28px #163e3010}.panel h2{font-size:18px;margin:0 0 14px}.hint{color:#65776e;font-size:13px;line-height:1.9}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #d5e1da;border-radius:10px;font:inherit;background:#fff}button,.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:#176b4d;color:#fff}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e8f1ec;color:#18553f}.danger{background:#fff0ef;color:#9d2a24}.message{display:none;padding:12px;border-radius:10px;font-size:13px;line-height:1.8;margin:12px 0}.message.success{display:block;background:#e6f6ed;color:#17613d}.message.error{display:block;background:#ffeded;color:#9b2525}.reservation-list{display:grid;gap:14px}.reservation{border:1px solid #e0e9e4;border-radius:14px;padding:16px;display:grid;gap:9px}.reservation h3{margin:0;font-size:17px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.detail{background:#f6f9f7;border-radius:9px;padding:9px;font-size:12px;line-height:1.8;overflow-wrap:anywhere}.detail strong{display:block;color:#557064;margin-bottom:2px}.status{display:inline-block;width:max-content;border-radius:20px;background:#fff2d9;color:#815313;padding:4px 10px;font-size:12px}.status.confirmed{background:#e3f7e9;color:#17613d}.status.rejected,.status.cancelled{background:#ffeded;color:#9b2525}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.empty{text-align:center;color:#65776e;padding:28px 10px;font-size:13px}.top-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}@media(max-width:600px){.details{grid-template-columns:1fr}.panel{padding:16px}}
  </style>
</head>
<body>
<header><div class="wrap"><h1>افرا سفر | درخواست‌های رزرو</h1><p>درخواست‌های مربوط به اقامتگاه‌های خودت را بررسی کن.</p></div></header>
<main>
  <section class="panel" id="loginPanel">
    <h2>ورود مالک</h2><p class="hint">با همان حسابی وارد شو که برای پنل مالک افرا سفر استفاده می‌کنی.</p>
    <form id="loginForm"><div class="field"><label for="email">ایمیل</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">رمز عبور</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" type="submit">ورود و مشاهده رزروها</button></form>
    <div id="loginMessage" class="message" role="status"></div>
  </section>
  <section id="dashboard" style="display:none">
    <div class="top-actions"><div><h2 style="margin:0">رزروهای اقامتگاه‌های من</h2><p class="hint" style="margin:5px 0 0">وضعیت هر درخواست را پس از بررسی تغییر بده.</p></div><button id="refreshBtn" class="secondary">بروزرسانی</button><button id="logoutBtn" class="secondary">خروج</button></div>
    <div id="dashboardMessage" class="message" role="status"></div>
    <div id="reservationList" class="reservation-list"><div class="panel empty">در حال دریافت درخواست‌ها...</div></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
(() => {
  const loginPanel=document.getElementById('loginPanel');
  const dashboard=document.getElementById('dashboard');
  const loginForm=document.getElementById('loginForm');
  const loginMessage=document.getElementById('loginMessage');
  const dashboardMessage=document.getElementById('dashboardMessage');
  const reservationList=document.getElementById('reservationList');
  const loginBtn=document.getElementById('loginBtn');
  const statusLabels={pending:'در انتظار بررسی',confirmed:'تأییدشده',rejected:'ردشده',cancelled:'لغوشده'};
  function escapeHtml(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
  function showMessage(el,text,type){el.className='message '+type;el.textContent=text}
  function hideMessage(el){el.className='message';el.textContent=''}
  function faDate(value){if(!value)return '—';const d=new Date(value+'T12:00:00');return Number.isNaN(d.getTime())?value:d.toLocaleDateString('fa-IR')}
  function statusClass(status){return ['confirmed','rejected','cancelled'].includes(status)?status:''}
  async function loadReservations(){
    hideMessage(dashboardMessage);reservationList.innerHTML='<div class="panel empty">در حال دریافت درخواست‌ها...</div>';
    const {data:userData,error:userError}=await afraSupabase.auth.getUser();
    if(userError||!userData.user){loginPanel.style.display='block';dashboard.style.display='none';showMessage(loginMessage,'برای ادامه دوباره وارد حساب مالک شو.','error');return}
    const {data:properties,error:propertyError}=await afraSupabase.from('properties').select('id,title,location,owner_id').eq('owner_id',userData.user.id);
    if(propertyError){reservationList.innerHTML='';showMessage(dashboardMessage,'دریافت اقامتگاه‌ها ناموفق بود: '+propertyError.message,'error');return}
    if(!properties||properties.length===0){reservationList.innerHTML='<div class="panel empty">هنوز اقامتگاهی به این حساب مالک متصل نشده است.</div>';return}
    const propertyMap=new Map(properties.map(p=>[p.id,p]));
    const ids=properties.map(p=>p.id);
    const {data:reservations,error}=await afraSupabase.from('reservations').select('id,property_id,guest_name,guest_phone,check_in,check_out,guest_count,guest_message,status,created_at').in('property_id',ids).order('created_at',{ascending:false});
    if(error){reservationList.innerHTML='';showMessage(dashboardMessage,'دریافت رزروها انجام نشد: '+error.message,'error');return}
    if(!reservations||reservations.length===0){reservationList.innerHTML='<div class="panel empty">هنوز درخواست رزروی برای اقامتگاه‌های تو ثبت نشده است.</div>';return}
    reservationList.innerHTML=reservations.map(r=>{const p=propertyMap.get(r.property_id)||{};const created=r.created_at?new Date(r.created_at).toLocaleString('fa-IR'):'—';const canUpdate=r.status==='pending';return `<article class="reservation"><h3>${escapeHtml(p.title||'اقامتگاه')}</h3><span class="status ${statusClass(r.status)}">${escapeHtml(statusLabels[r.status]||r.status)}</span><div class="details"><div class="detail"><strong>نام مهمان</strong>${escapeHtml(r.guest_name)}</div><div class="detail"><strong>شماره تماس</strong><a href="tel:${escapeHtml(r.guest_phone)}">${escapeHtml(r.guest_phone)}</a></div><div class="detail"><strong>تاریخ ورود</strong>${escapeHtml(faDate(r.check_in))}</div><div class="detail"><strong>تاریخ خروج</strong>${escapeHtml(faDate(r.check_out))}</div><div class="detail"><strong>تعداد مهمان</strong>${escapeHtml(r.guest_count)} نفر</div><div class="detail"><strong>زمان ثبت درخواست</strong>${escapeHtml(created)}</div><div class="detail" style="grid-column:1/-1"><strong>توضیحات مهمان</strong>${escapeHtml(r.guest_message||'توضیحی ثبت نشده است')}</div></div>${canUpdate?`<div class="actions"><button type="button" onclick="updateReservationStatus('${escapeHtml(r.id)}','confirmed')">تأیید رزرو</button><button type="button" class="danger" onclick="updateReservationStatus('${escapeHtml(r.id)}','rejected')">رد درخواست</button></div>`:''}</article>`}).join('');
  }
  window.updateReservationStatus=async function(id,status){
    if(!['confirmed','rejected'].includes(status))return;
    const label=status==='confirmed'?'تأیید':'رد';
    if(!confirm('از '+label+' این درخواست رزرو مطمئنی؟'))return;
    hideMessage(dashboardMessage);
    const {data:userData}=await afraSupabase.auth.getUser();
    if(!userData.user){showMessage(dashboardMessage,'ابتدا وارد حساب مالک شو.','error');return}
    const {data:properties,error:propertyError}=await afraSupabase.from('properties').select('id').eq('owner_id',userData.user.id);
    if(propertyError){showMessage(dashboardMessage,'بررسی مالکیت اقامتگاه ناموفق بود: '+propertyError.message,'error');return}
    const ids=(properties||[]).map(p=>p.id);
    if(!ids.length){showMessage(dashboardMessage,'اقامتگاهی برای این حساب پیدا نشد.','error');return}
    const {error}=await afraSupabase.from('reservations').update({status}).eq('id',id).eq('status','pending').in('property_id',ids);
    if(error){showMessage(dashboardMessage,'تغییر وضعیت انجام نشد: '+error.message,'error');return}
    showMessage(dashboardMessage,status==='confirmed'?'درخواست رزرو تأیید شد.':'درخواست رزرو رد شد.','success');
    await loadReservations();
  };
  loginForm.addEventListener('submit',async e=>{e.preventDefault();hideMessage(loginMessage);loginBtn.disabled=true;loginBtn.textContent='در حال ورود...';const {error}=await afraSupabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});loginBtn.disabled=false;loginBtn.textContent='ورود و مشاهده رزروها';if(error){showMessage(loginMessage,'ورود انجام نشد: '+error.message,'error');return}loginPanel.style.display='none';dashboard.style.display='block';await loadReservations()});
  document.getElementById('refreshBtn').addEventListener('click',loadReservations);
  document.getElementById('logoutBtn').addEventListener('click',async()=>{await afraSupabase.auth.signOut();dashboard.style.display='none';loginPanel.style.display='block';loginForm.reset();hideMessage(loginMessage)});
  if(typeof afraSupabase==='undefined'){showMessage(loginMessage,'فایل supabase.js بارگذاری نشد. مطمئن شو این فایل کنار owner-reservations.html قرار دارد.','error');return}
  afraSupabase.auth.getSession().then(({data})=>{if(data.session){loginPanel.style.display='none';dashboard.style.display='block';loadReservations()}});
})();
</script>
</body>
</html>
